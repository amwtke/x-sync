interface:
  display_name: "X-Sync"
  short_description: "用仓库证据持续校准工程师、Agent 与代码之间的理解"
  default_prompt: "Use $x-sync on the current repository or honor -d <target-project> when supplied; for that target, resume any unfinished session first, otherwise, before the first new session, scan the safe whole project and then open a local interactive HTML assessment: Socratic, mixed business and technical, 5 questions."

policy:
  allow_implicit_invocation: true
