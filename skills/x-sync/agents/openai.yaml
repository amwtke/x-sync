interface:
  display_name: "X-Sync"
  short_description: "用仓库证据持续校准工程师、Agent 与代码之间的理解"
  default_prompt: "Use $x-sync on the current repository or honor -d <target-project> when supplied. Open or resume the default Dialogue v2 local browser conversation: repository-grounded, adaptive, one question at a time, mixed business and technical when relevant, and naturally completed with no fixed question count. Use the legacy fixed-bank quiz only when explicitly requested."

policy:
  allow_implicit_invocation: true
